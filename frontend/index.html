    <style id="pwa-splash-critical">
      html.pwa-starting,
      html.pwa-starting body {
        margin: 0;
        background: #000 !important;
      }
      #pwa-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }
      #pwa-splash img {
        display: block;
        width: min(92vw, 707px);
        height: auto;
        max-height: min(42dvh, 353px);
        object-fit: contain;
        object-position: center;
      }
      #root:empty {
        visibility: hidden;
      }
    </style>
    <title>Samarth SurveyOS</title>
  </head>
  <body style="margin: 0; background: #000">
    <div id="pwa-splash" aria-hidden="true">
      <img
        src="/splash/logo-bg2.png"
        alt=""
        width="707"
        height="353"
        decoding="sync"
        fetchpriority="high"
      />
    </div>
    <div id="root"></div>
    <script>
      ;(function () {
        var splash = document.getElementById('pwa-splash')
        var critical = document.getElementById('pwa-splash-critical')
        var hideTimer
        function hideSplash() {
          if (!splash) return
          splash.remove()
          splash = null
          if (critical) critical.remove()
          document.documentElement.classList.remove('pwa-starting')
        }
        window.__hidePwaSplash = hideSplash
        hideTimer = window.setTimeout(hideSplash, 8000)
        window.__hidePwaSplash = function () {
          window.clearTimeout(hideTimer)
          hideSplash()
        }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
